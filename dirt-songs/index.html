<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Dirt — Song List</title>
<style>
  :root {
    --bg: #f7f5f2;
    --panel: #ffffff;
    --ink: #232019;
    --ink-soft: #6b6459;
    --line: #e6e1d8;
    --accent: #8a6d3b;
    --accent-soft: #f1e9db;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }

  header {
    padding: 48px 24px 24px;
    text-align: center;
  }

  header h1 {
    margin: 0 0 6px;
    font-size: 2rem;
    letter-spacing: 0.02em;
  }

  header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.95rem;
  }

  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 20px 64px;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 220px;
  }

  #search {
    width: 100%;
    padding: 10px 14px;
    font-size: 0.95rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
    color: var(--ink);
  }

  #search:focus {
    outline: none;
    border-color: var(--accent);
  }

  .search-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    max-height: 280px;
    overflow-y: auto;
    z-index: 5;
  }
  .search-dropdown.open { display: block; }

  .search-dropdown-label {
    padding: 8px 14px 4px;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
  }

  .search-dropdown-item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 0.92rem;
  }
  .search-dropdown-item:hover { background: var(--accent-soft); }
  .search-dropdown-item .sdi-artist {
    color: var(--ink-soft);
    font-size: 0.82rem;
    white-space: nowrap;
  }

  .count {
    font-size: 0.85rem;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    text-align: left;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    background: var(--accent-soft);
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    border-bottom: 1px solid var(--line);
  }

  thead th:hover { color: var(--ink); }

  thead th .arrow {
    display: inline-block;
    width: 0.8em;
    opacity: 0.5;
  }

  thead th.sorted .arrow { opacity: 1; }

  tbody td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 0.95rem;
    vertical-align: middle;
  }

  tbody tr:last-child td { border-bottom: none; }

  tbody tr:hover { background: #fbfaf7; }

  td.title { font-weight: 600; }

  td.key {
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
  }

  .links {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .links a {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    font-size: 0.82rem;
    border-radius: 999px;
    text-decoration: none;
    border: 1px solid var(--line);
    color: var(--accent);
    background: var(--accent-soft);
    white-space: nowrap;
  }

  .links a:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .links span.none {
    font-size: 0.82rem;
    color: #b8b1a4;
    padding: 5px 0;
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-soft);
    display: none;
  }

  footer {
    text-align: center;
    padding: 24px;
    color: var(--ink-soft);
    font-size: 0.8rem;
  }

  button.add-btn {
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 600;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  button.add-btn:hover { opacity: 0.9; }

  .row-actions {
    display: flex;
    gap: 6px;
  }
  .row-actions button {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink-soft);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 0.78rem;
    cursor: pointer;
  }
  .row-actions button:hover { background: var(--accent-soft); color: var(--ink); }
  .row-actions button.danger:hover { background: #f4dede; color: #a33; border-color: #e0b8b8; }

  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(35, 32, 25, 0.4);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: var(--panel);
    border-radius: var(--radius);
    padding: 24px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.2);
  }
  .modal h2 { margin: 0 0 16px; font-size: 1.15rem; }
  .modal label {
    display: block;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin: 12px 0 4px;
  }
  .modal input {
    width: 100%;
    padding: 9px 12px;
    font-size: 0.95rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }
  .modal input:focus { outline: none; border-color: var(--accent); }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
  }
  .modal-actions button {
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
  }
  .modal-actions button.primary {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }
  .modal-error {
    color: #a33;
    font-size: 0.82rem;
    margin-top: 10px;
    display: none;
  }
  .autofill-hint {
    color: var(--ink-soft);
    font-size: 0.78rem;
    margin: 6px 0 0;
    display: none;
  }
  .autofill-hint.visible { display: block; }
  .loading-state, .error-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-soft);
  }
  .error-state { color: #a33; display: none; }

  @media (max-width: 640px) {
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }
    tbody td {
      border: none;
      padding: 3px 0;
    }
    td.title { font-size: 1.05rem; }
    td.artist::before { content: ""; }
    td.key::before { content: "Key: "; }
    .links { margin-top: 6px; }
    .row-actions { margin-top: 6px; }
  }
</style>
</head>
<body>

<header>
  <h1>For Dirt</h1>
  <p>Song list — artist, title, key, audio, and charts</p>
</header>

<main>
  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Search by title, artist, or key…" autocomplete="off">
      <div class="search-dropdown" id="searchDropdown"></div>
    </div>
    <div class="count" id="count"></div>
    <button class="add-btn" id="addBtn">+ Add Song</button>
  </div>

  <p class="loading-state" id="loadingState">Loading songs…</p>
  <p class="error-state" id="errorState">Couldn't load songs. Refresh to try again.</p>

  <div class="table-wrap" id="tableWrap" style="display:none;">
    <table>
      <thead>
        <tr>
          <th data-key="title">Title <span class="arrow"></span></th>
          <th data-key="artist">Artist <span class="arrow"></span></th>
          <th data-key="key">Key <span class="arrow"></span></th>
          <th>Audio</th>
          <th>Chart</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="empty-state" id="emptyState">No songs match your search.</p>
  </div>
</main>

<footer>
  For Dirt · updated <span id="updated"></span>
  · song key data via <a href="https://getsongbpm.com" target="_blank" rel="noopener">GetSongBPM.com</a>
</footer>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2 id="modalTitle">Add Song</h2>
    <label for="fTitle">Title</label>
    <input type="text" id="fTitle" placeholder="Song title">
    <label for="fArtist">Artist</label>
    <input type="text" id="fArtist" placeholder="Artist">
    <p class="autofill-hint" id="autofillHint">Looking up key, audio, and chart info…</p>
    <label for="fKey">Key</label>
    <input type="text" id="fKey" placeholder="e.g. G, D/A, Capo 2 (D)">
    <label for="fAudio">Audio link</label>
    <input type="text" id="fAudio" placeholder="https://…">
    <label for="fChart">Chart link</label>
    <input type="text" id="fChart" placeholder="https://…">
    <p class="modal-error" id="modalError"></p>
    <div class="modal-actions">
      <button id="modalCancel">Cancel</button>
      <button class="primary" id="modalSave">Save</button>
    </div>
  </div>
</div>

<script>
  // Songs are fetched live from the backend (/api/songs) — anyone visiting
  // this page can add, edit, or delete songs and it persists for everyone.

  const API = '/api/songs';

  let SONGS = [];
  let editingId = null; // null = adding a new song

  const rowsEl = document.getElementById('rows');
  const searchEl = document.getElementById('search');
  const searchDropdown = document.getElementById('searchDropdown');
  const countEl = document.getElementById('count');
  const emptyState = document.getElementById('emptyState');
  const tableWrap = document.getElementById('tableWrap');
  const loadingState = document.getElementById('loadingState');
  const errorState = document.getElementById('errorState');
  const headers = document.querySelectorAll('thead th[data-key]');

  const addBtn = document.getElementById('addBtn');
  const modalBackdrop = document.getElementById('modalBackdrop');
  const modalTitle = document.getElementById('modalTitle');
  const modalError = document.getElementById('modalError');
  const modalSave = document.getElementById('modalSave');
  const modalCancel = document.getElementById('modalCancel');
  const fTitle = document.getElementById('fTitle');
  const fArtist = document.getElementById('fArtist');
  const fKey = document.getElementById('fKey');
  const fAudio = document.getElementById('fAudio');
  const fChart = document.getElementById('fChart');
  const autofillHint = document.getElementById('autofillHint');

  let sortKey = 'title';
  let sortAsc = true;

  function linkButton(url, label) {
    if (!url) return '';
    return `<a href="${escapeAttr(url)}" target="_blank" rel="noopener">${label} ↗</a>`;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[s]));
  }
  function escapeAttr(str) { return escapeHtml(str); }

  function render() {
    const query = searchEl.value.trim().toLowerCase();

    let filtered = SONGS.filter(s =>
      !query ||
      s.title.toLowerCase().includes(query) ||
      s.artist.toLowerCase().includes(query) ||
      s.key.toLowerCase().includes(query)
    );

    filtered.sort((a, b) => {
      const va = (a[sortKey] || '').toLowerCase();
      const vb = (b[sortKey] || '').toLowerCase();
      if (va < vb) return sortAsc ? -1 : 1;
      if (va > vb) return sortAsc ? 1 : -1;
      return 0;
    });

    rowsEl.innerHTML = filtered.map(s => {
      const audioBtn = linkButton(s.audio, 'Audio');
      const chartBtn = linkButton(s.chart, 'Chart');
      return `<tr data-id="${s.id}">
        <td class="title">${escapeHtml(s.title)}</td>
        <td class="artist">${escapeHtml(s.artist)}</td>
        <td class="key">${escapeHtml(s.key)}</td>
        <td class="links">${audioBtn || '<span class="none">—</span>'}</td>
        <td class="links">${chartBtn || '<span class="none">—</span>'}</td>
        <td class="row-actions">
          <button class="edit-btn" data-id="${s.id}">Edit</button>
          <button class="danger delete-btn" data-id="${s.id}">Delete</button>
        </td>
      </tr>`;
    }).join('');

    countEl.textContent = `${filtered.length} song${filtered.length === 1 ? '' : 's'}`;
    emptyState.style.display = filtered.length ? 'none' : 'block';

    headers.forEach(h => {
      h.classList.toggle('sorted', h.dataset.key === sortKey);
      const arrow = h.querySelector('.arrow');
      arrow.textContent = h.dataset.key === sortKey ? (sortAsc ? '▲' : '▼') : '';
    });

    rowsEl.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => openModal(parseInt(btn.dataset.id, 10)));
    });
    rowsEl.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteSong(parseInt(btn.dataset.id, 10)));
    });
  }

  async function loadSongs() {
    loadingState.style.display = 'block';
    errorState.style.display = 'none';
    tableWrap.style.display = 'none';
    try {
      const res = await fetch(API);
      if (!res.ok) throw new Error('bad response');
      SONGS = await res.json();
      loadingState.style.display = 'none';
      tableWrap.style.display = '';
      render();
    } catch (err) {
      loadingState.style.display = 'none';
      errorState.style.display = 'block';
    }
  }

  headers.forEach(h => {
    h.addEventListener('click', () => {
      const key = h.dataset.key;
      if (sortKey === key) {
        sortAsc = !sortAsc;
      } else {
        sortKey = key;
        sortAsc = true;
      }
      render();
    });
  });

  // ── Search-bar artist picker (looks up other artists for a title) ─────────
  let searchLookupRequestId = 0;
  let searchDebounceTimer = null;

  function hideSearchDropdown() {
    searchDropdown.classList.remove('open');
    searchDropdown.innerHTML = '';
  }

  function renderSearchDropdown(results) {
    if (!results.length) { hideSearchDropdown(); return; }
    searchDropdown.innerHTML =
      '<div class="search-dropdown-label">Add from search</div>' +
      results.map((r, i) => `
        <div class="search-dropdown-item" data-index="${i}">
          <span class="sdi-title">${escapeHtml(r.title)}</span>
          <span class="sdi-artist">${escapeHtml(r.artist)}</span>
        </div>
      `).join('');
    searchDropdown.classList.add('open');
    searchDropdown.querySelectorAll('.search-dropdown-item').forEach(item => {
      item.addEventListener('click', () => {
        const r = results[parseInt(item.dataset.index, 10)];
        hideSearchDropdown();
        searchEl.value = '';
        render();
        openModal(null);
        fTitle.value = r.title;
        fArtist.value = r.artist;
        autoFillFromLookup();
      });
    });
  }

  async function fetchArtistOptions(query) {
    const requestId = ++searchLookupRequestId;
    try {
      const res = await fetch(`/api/search-artists?title=${encodeURIComponent(query)}`);
      if (requestId !== searchLookupRequestId) return; // superseded by a newer keystroke
      if (!res.ok) { hideSearchDropdown(); return; }
      const data = await res.json();
      if (requestId !== searchLookupRequestId) return;
      renderSearchDropdown(data.results || []);
    } catch (err) {
      hideSearchDropdown();
    }
  }

  searchEl.addEventListener('input', () => {
    render();
    clearTimeout(searchDebounceTimer);
    const query = searchEl.value.trim();
    if (query.length < 2) { hideSearchDropdown(); return; }
    searchDebounceTimer = setTimeout(() => fetchArtistOptions(query), 350);
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) hideSearchDropdown();
  });

  // ── Add / Edit modal ──────────────────────────────────────────────────────
  let autofillRequestId = 0;

  async function autoFillFromLookup() {
    const title = fTitle.value.trim();
    if (!title) return;
    const artist = fArtist.value.trim();
    const requestId = ++autofillRequestId;
    autofillHint.classList.add('visible');
    try {
      const params = new URLSearchParams({ title });
      if (artist) params.set('artist', artist);
      const res = await fetch(`/api/lookup?${params}`);
      if (requestId !== autofillRequestId) return; // a newer lookup superseded this one
      if (!res.ok) return;
      const data = await res.json();
      if (!fAudio.value.trim() && data.audio) fAudio.value = data.audio;
      if (!fChart.value.trim() && data.chart) fChart.value = data.chart;
      if (!fKey.value.trim() && data.key) fKey.value = data.key;
    } catch (err) {
      // network error — leave fields as-is, user can fill manually
    } finally {
      if (requestId === autofillRequestId) autofillHint.classList.remove('visible');
    }
  }

  function openModal(id) {
    editingId = id ?? null;
    modalError.style.display = 'none';
    autofillHint.classList.remove('visible');
    autofillRequestId++; // cancel any in-flight lookup from a previous open
    if (editingId) {
      const s = SONGS.find(x => x.id === editingId);
      modalTitle.textContent = 'Edit Song';
      fTitle.value = s.title;
      fArtist.value = s.artist;
      fKey.value = s.key;
      fAudio.value = s.audio;
      fChart.value = s.chart;
    } else {
      modalTitle.textContent = 'Add Song';
      fTitle.value = '';
      fArtist.value = '';
      fKey.value = '';
      fAudio.value = '';
      fChart.value = '';
    }
    modalBackdrop.classList.add('open');
    fTitle.focus();
  }

  function closeModal() {
    modalBackdrop.classList.remove('open');
  }

  addBtn.addEventListener('click', () => openModal(null));
  modalCancel.addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', (e) => {
    if (e.target === modalBackdrop) closeModal();
  });

  fTitle.addEventListener('blur', autoFillFromLookup);
  fArtist.addEventListener('blur', autoFillFromLookup);

  modalSave.addEventListener('click', async () => {
    const payload = {
      title: fTitle.value.trim(),
      artist: fArtist.value.trim(),
      key: fKey.value.trim(),
      audio: fAudio.value.trim(),
      chart: fChart.value.trim(),
    };
    if (!payload.title) {
      modalError.textContent = 'Title is required.';
      modalError.style.display = 'block';
      return;
    }
    modalSave.disabled = true;
    try {
      const url = editingId ? `${API}/${editingId}` : API;
      const method = editingId ? 'PUT' : 'POST';
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error('save failed');
      closeModal();
      await loadSongs();
    } catch (err) {
      modalError.textContent = "Couldn't save — try again.";
      modalError.style.display = 'block';
    } finally {
      modalSave.disabled = false;
    }
  });

  async function deleteSong(id) {
    const s = SONGS.find(x => x.id === id);
    if (!confirm(`Delete "${s ? s.title : 'this song'}"?`)) return;
    try {
      const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
      if (!res.ok) throw new Error('delete failed');
      await loadSongs();
    } catch (err) {
      alert("Couldn't delete — try again.");
    }
  }

  document.getElementById('updated').textContent = new Date().toLocaleDateString('en-US', {
    year: 'numeric', month: 'long', day: 'numeric'
  });

  loadSongs();
</script>

</body>
</html>
